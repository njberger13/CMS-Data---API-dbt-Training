version: 2

models:
  - name: stg_pos_qies
    columns:
      - name: provider_number
        data_tests:
          - not_null
          - unique

      - name: facility_name
        data_tests:
          - not_null

      - name: zip_code
        data_tests:
          - not_null

      - name: state_code
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [
                  'AL', 'AK', 'AZ', 'AR', 'CA', 'CO', 'CT', 'DE',
                  'FL', 'GA', 'HI', 'ID', 'IL', 'IN', 'IA', 'KS',
                  'KY', 'LA', 'ME', 'MD', 'MA', 'MI', 'MN', 'MS',
                  'MO', 'MT', 'NE', 'NV', 'NH', 'NJ', 'NM', 'NY',
                  'NC', 'ND', 'OH', 'OK', 'OR', 'PA', 'RI', 'SC',
                  'SD', 'TN', 'TX', 'UT', 'VT', 'VA', 'WA', 'WV',
                  'WI', 'WY', 'DC', 'GU', 'PR', 'VI', 'MP', 'CN', 'MX', 'AS' #DC, guam, puerto rico, virgin islands, northern mariana, canada, mexico, american samoa
                ]

  - name: stg_cost_reports
    columns:
      - name: provider_ccn
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_pos_qies')
                field: provider_number
              severity: warn

      - name: id
        data_tests:
          - not_null
          - unique

      - name: fiscal_year_begin
        data_tests:
          - not_null

      - name: fiscal_year_end
        data_tests:
          - not_null