version: 2

models:
  - name: stg_pos_qies
    columns:
      - name: provider_number
        data_tests:
          - not_null
          - unique

      - name: facility_name
        data_tests:
          - not_null

      - name: zip_code
        data_tests:
          - not_null

      - name: state_code
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [
                  'AL', 'AK', 'AZ', 'AR', 'CA', 'CO', 'CT', 'DE',
                  'FL', 'GA', 'HI', 'ID', 'IL', 'IN', 'IA', 'KS',
                  'KY', 'LA', 'ME', 'MD', 'MA', 'MI', 'MN', 'MS',
                  'MO', 'MT', 'NE', 'NV', 'NH', 'NJ', 'NM', 'NY',
                  'NC', 'ND', 'OH', 'OK', 'OR', 'PA', 'RI', 'SC',
                  'SD', 'TN', 'TX', 'UT', 'VT', 'VA', 'WA', 'WV',
                  'WI', 'WY'
                ]